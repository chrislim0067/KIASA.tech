# Continuous integration.
#
# THREE jobs, split by what they need rather than by what they check.
#
#   `static`   — CLI pinning, typecheck, lint, build, audit, secret scan and its
#                self-test, migration manifest and its test suite. No services,
#                no credentials, fast, and the job that gates most pull requests.
#
#   `database` — the suites that only mean something against a real Postgres
#                with the real policies applied: RLS, privileges, cascades,
#                constraint parity, security regressions, the HTTP gates, and
#                the end-to-end logout test with a real authenticated session.
#                It resets a LOCAL Supabase stack from empty and applies every
#                migration in order, which is also the only automatic proof that
#                the migrations still work on a database that has never seen
#                them.
#
#   `history`  — a history-aware secret scan. The working-tree scan cannot say
#                anything about a secret that was committed and later removed,
#                and this repository is public with many remote branches.
#
# NO PRODUCTION CREDENTIALS ARE USED OR REQUIRED. Every value below comes from
# `supabase start` on the runner. If a step here ever needs a repository secret,
# that is a design error to fix rather than a secret to add: CI must not be able
# to reach the production database.
#
# The Supabase CLI is a pinned devDependency, so `npm ci` installs the exact
# version this repository was tested against on every platform. There is
# deliberately no setup-cli action: two sources for one version is how they
# drift apart.
name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

# A second push supersedes the first; there is no value in finishing a run for a
# commit nobody will look at.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  static:
    name: Static checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.0
        with:
          # The secret scan reads tracked files, not history; a shallow clone is
          # enough and keeps the checkout fast.
          fetch-depth: 1
          # Do not leave the job's GITHUB_TOKEN in .git/config, where every later
          # step -- including any dependency install script -- could reuse it.
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm

      # `ci`, not `install`: it installs exactly the lockfile and fails if
      # package.json and the lockfile disagree, which is itself a check.
      - name: Install dependencies
        run: npm ci

      # One version source for local development and CI. Asserts the CLI that
      # actually executes reports exactly the pinned version, not merely that
      # package.json asks for it.
      - name: Supabase CLI is pinned
        run: npm run check:cli

      # The scanner is tested BEFORE it is trusted. A pattern scanner that has
      # quietly stopped matching reports "clean" exactly like a clean tree does,
      # and the two are indistinguishable in a log. This plants a representative
      # secret for every rule and fails if any goes unreported.
      - name: Secret scanner self-test
        run: npm run test:secrets

      - name: Secret scan
        run: node scripts/scan-secrets.mjs

      # Documentation is executable: contributors copy commands out of it. This
      # fails if an unsafe one reappears -- `npx supabase` (an unpinned CLI), a
      # direct `supabase gen types`, or a `>` redirect into database.types.ts,
      # which truncates the file before the command has even run.
      - name: Documentation command hygiene
        run: npm run test:docs

      # The exposure diagnostic's LOGIC, offline, with injected Docker
      # responses. The diagnostic itself is deliberately NOT run here: a runner
      # is a different machine on a different network, so anything it measured
      # would say nothing about the developer's Windows host, and a green check
      # would be actively misleading. What CI can honestly assert is that the
      # reasoning fails closed -- that a container which cannot be inspected
      # produces UNKNOWN_OR_INCOMPLETE rather than a clean result.
      - name: Exposure diagnostic logic (offline)
        run: npm run test:exposure

      # The résumé provider path, entirely offline: hand-built PDF fixtures and
      # a mocked fetch. It never calls OpenRouter and needs no key — the base
      # URL is pointed at a closed loopback port, so an accidental real request
      # fails locally instead of reaching a provider and spending money.
      #
      # It also asserts the two things that would regress silently: that the
      # original PDF bytes never appear in the request body, and that no
      # executable Anthropic path has come back.
      - name: Résumé provider (offline, mocked)
        run: npm run test:resume:provider

      # Same reasoning as the scanner: the manifest checker is tested before it
      # is trusted. It previously reported an unrecorded migration and exited 0,
      # which no assertion anywhere would have caught.
      - name: Migration manifest checker self-test
        run: npm run test:migrations

      - name: Migration order and content parity
        run: npm run db:check:order

      - name: TypeScript
        run: npm run typecheck

      - name: ESLint
        run: npm run lint

      - name: Production build
        run: npm run build

      # A GATE, not a report. `--audit-level=high` exits non-zero only for high
      # and critical advisories; existing low advisories are still printed and
      # still do not fail the build. This previously carried
      # `continue-on-error: true`, which made it a step that could never fail --
      # describing that as a security gate was the actual defect.
      - name: Dependency audit (high and critical fail the build)
        run: npm audit --audit-level=high

  database:
    name: Database suites (local Supabase)
    runs-on: ubuntu-latest
    # Generous on purpose: the end-to-end test loads the homepage several times,
    # and each load spends ~25-30s decoding the hero's seven textures through
    # software GL on a runner with no GPU.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # No setup-cli action. `npm ci` already installed the pinned CLI from the
      # lockfile, which records all eight platform binaries at 2.117.0. A second
      # source for the same version is how the two drift apart, and the local
      # scripts were previously using an entirely different (unpinned) CLI from
      # the one this job installed.
      - name: Supabase CLI is pinned
        run: npm run check:cli

      # `supabase start` applies every migration in supabase/migrations to a
      # database created moments earlier — migrations-from-empty, proven on
      # every run rather than asserted in a report.
      - name: Start local Supabase
        run: npm run db:start

      - name: Confirm the stack is local before anything touches it
        run: |
          set -euo pipefail
          node scripts/supabase.mjs status -o env > /tmp/supabase.env
          # shellcheck disable=SC1091
          . /tmp/supabase.env
          case "$API_URL" in
            http://127.0.0.1:*|http://localhost:*) echo "Local stack confirmed: $API_URL" ;;
            *) echo "REFUSING: API_URL is not local ($API_URL)"; exit 1 ;;
          esac

      - name: Reset the database from empty and re-apply all migrations
        run: npm run db:reset

      - name: Database, RLS, privilege, cascade and security suites
        run: npm run test:db

      - name: Admin authorization suites
        run: npm run test:admin

      # Generated types must match the schema the migrations just produced.
      # A drift here is what forces `as never` workarounds into the data layer.
      - name: Generated types match the schema
        run: node scripts/test-type-generation.mjs

      # The HTTP suites start the real server and drive real @supabase/ssr
      # sessions, so they need a production build first. They prove the route
      # and API gates in front of RLS, which the database suites cannot see.
      - name: Production build (for the HTTP suites)
        run: npm run build

      - name: Admin HTTP authorization
        run: npm run test:admin:api

      - name: Candidate profile route gate
        run: npm run test:profile:http

      # The end-to-end logout regression. It creates a throwaway user in the
      # local stack, signs in for real, drives a real Chrome, clicks the
      # application's own sign-out button and proves the session is gone.
      #
      # Its predecessor never ran here at all: it looked for Chrome in two
      # Windows paths only, so it could not run on Linux and was left out of
      # CI entirely -- which is why nobody noticed it also signed out without
      # ever signing in.
      - name: Locate Chrome for the end-to-end test
        run: |
          set -euo pipefail
          BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$BIN" ]; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq chromium-browser
            BIN="$(command -v chromium-browser || command -v chromium)"
          fi
          echo "CHROME_BIN=$BIN" >> "$GITHUB_ENV"
          "$BIN" --version

      - name: Logout end-to-end (real authenticated session)
        run: npm run test:auth

      - name: Stop local Supabase
        if: always()
        run: npm run db:stop

  history:
    name: Secret scan over git history
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # fetch-depth: 0 — the whole point of this job. A shallow clone cannot
      # prove anything about history, and a secret removed in a later commit is
      # still published in the commit that added it.
      #
      # This scans the history reachable from the ref being built. That is worth
      # stating precisely, because an earlier report did not: this repository
      # has MANY remote branches (35 refs at the time of writing), and commits
      # can and do live outside `main` -- the Stage 0 commits themselves sat on
      # `chore/stage-0-baseline` and were not reachable from `main` until PR #19
      # merged them. A branch push is therefore scanned on its own ref, before
      # anything is merged, which is when a leak is still cheap to fix.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.0
        with:
          fetch-depth: 0
          persist-credentials: false

      # Run as a pinned container rather than a third-party action: no
      # marketplace action in the trust path, no licence key, nothing that
      # could be handed a token. Pinned BY DIGEST, so the bytes cannot change
      # under a tag. `--redact` keeps any match out of this public log.
      - name: gitleaks over full history (redacted)
        run: |
          docker run --rm -v "$PWD:/repo:ro" \
            ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            detect --source /repo --redact --no-banner
