<!-- ══ Anti-abuse, present BEFORE the POST exists ═════════════════════════════════════════════
     Pass 4 wires the submission. These two live here now rather than arriving with it, because
     scripts/check-tracking.mjs registers estimate.php as a lead form and fails while either is
     missing — which is exactly the guard working: a form must never be able to ship in the same
     commit that first makes it postable. The honeypot is a real field name, unlabelled and out of
     the tab order; api/lead.php answers success and stores nothing when it arrives filled.
     The Turnstile site key is public by design. Its secret counterpart lives only in
     api/secrets.php on the server and is never named in a served page. -->
<form id="wt-lead" autocomplete="off" onsubmit="return false;" style="position:absolute;left:-9999px;top:0" aria-hidden="true">
    <input type="checkbox" name="botcheck" id="wt-botcheck" tabindex="-1" autocomplete="off">
</form>
